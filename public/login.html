<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Mesh Quotes</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('mesh.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    html, body { background: var(--header-bg); }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .light-switch { position: fixed; top: 10px; right: 12px; }
    .signin { width: 100%; max-width: 380px; }
    .signin .logo { display: block; height: 34px; margin: 0 auto 28px; }
    .signin .card { padding: 28px; }
    .signin h1 { font-size: 20px; margin-bottom: 4px; }
    .signin p { margin: 0 0 18px; }
    .signin label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 500; }
    .signin .btn { width: 100%; margin-top: 16px; }
    .signin .error { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 1.2em; }
  </style>
</head>
<body>
  <button type="button" class="light-switch" id="light-switch" role="switch" aria-label="Light mode">
    <span class="ls-plate" aria-hidden="true"><span class="ls-rocker"></span></span>
  </button>
  <main class="signin">
    <img class="logo" src="/img/mesh-logo-white.png" alt="Mesh">
    <form class="card" id="form">
      <h1>Sign in</h1>
      <p class="muted sm">Enter the team password to open Mesh Quotes.</p>
      <label>Password<input type="password" id="password" autocomplete="current-password" required autofocus></label>
      <button class="btn primary lg" type="submit" id="submit">Sign in</button>
      <div class="error" id="error" role="alert"></div>
    </form>
  </main>
  <script>
    // Light switch (same as in the app, remembered on this device).
    const lightSwitch = document.getElementById('light-switch');
    function showSwitch() {
      const dark = document.documentElement.getAttribute('data-theme') === 'dark';
      lightSwitch.classList.toggle('dark', dark);
      lightSwitch.setAttribute('aria-checked', dark ? 'false' : 'true');
      lightSwitch.title = dark ? 'Turn the lights on (light mode)' : 'Turn the lights off (dark mode)';
    }
    lightSwitch.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      const root = document.documentElement;
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        root.classList.add('theme-transition');
        setTimeout(() => root.classList.remove('theme-transition'), 450);
      }
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('mesh.theme', next); } catch (e) {}
      showSwitch();
    });
    showSwitch();

    const form = document.getElementById('form');
    const error = document.getElementById('error');
    const submit = document.getElementById('submit');
    // Where to go afterwards, e.g. /#/quote/abc
    const next = location.hash.length > 1 ? location.hash : '#/';

    fetch('/api/session').then((r) => r.json()).then((s) => {
      if (s.signedIn) location.replace('/' + next);
      else if (s.setupMessage && s.setup === 'password') error.textContent = s.setupMessage;
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      submit.disabled = true;
      submit.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not sign in');
        location.replace('/' + next);
      } catch (err) {
        error.textContent = err.message;
        submit.disabled = false;
        submit.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
