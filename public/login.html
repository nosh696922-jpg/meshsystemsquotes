<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Mesh Quotes</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('mesh.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="icon" href="/img/favicon.png">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* The same blue glow and moving nodes as the page tops in the app:
       a soft blue wash in light mode, deep navy in dark mode. */
    html { background: var(--bg); }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background:
        radial-gradient(900px 520px at 85% 0%, var(--band-glow), transparent 60%),
        linear-gradient(180deg, var(--band-top) 0%, var(--band-top) 30%, var(--bg) 100%);
    }
    .login-mesh {
      position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none;
      -webkit-mask-image: linear-gradient(180deg, #000 30%, transparent 95%);
      mask-image: linear-gradient(180deg, #000 30%, transparent 95%);
    }
    .light-switch { position: fixed; top: 10px; right: 12px; z-index: 2; }
    .signin { position: relative; z-index: 1; width: 100%; max-width: 400px; }
    .signin .logo { display: block; height: 36px; margin: 0 auto 30px; }
    :root[data-theme='dark'] .signin .logo.for-light, :root:not([data-theme='dark']) .signin .logo.for-dark { display: none; }
    .signin .card { padding: 32px; border-radius: 22px; box-shadow: 0 1px 2px rgba(13, 20, 32, 0.05), 0 24px 60px rgba(13, 20, 32, 0.12); }
    :root[data-theme='dark'] .signin .card { border-color: transparent; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); }
    .signin .eyebrow { margin-bottom: 8px; }
    .signin h1 { font-size: 26px; margin-bottom: 6px; }
    .signin p.muted { margin: 0 0 20px; font-size: 13.5px; }
    .signin label { display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
    .signin input { min-height: 46px; }
    .signin .btn { width: 100%; margin-top: 18px; }
    .signin .error { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 1.2em; }
  </style>
</head>
<body>
  <button type="button" class="light-switch" id="light-switch" role="switch" aria-label="Light mode">
    <span class="ls-plate" aria-hidden="true"><span class="ls-rocker"></span></span>
  </button>
  <canvas class="login-mesh" id="mesh" aria-hidden="true"></canvas>
  <main class="signin">
    <img class="logo for-light" src="/img/mesh-logo-dark.png" alt="Mesh">
    <img class="logo for-dark" src="/img/mesh-logo-white.png" alt="Mesh">
    <form class="card" id="form">
      <p class="eyebrow">Mesh Quotes</p>
      <h1>Sign in</h1>
      <p class="muted sm">Enter the team password to open Mesh Quotes.</p>
      <label>Password<input type="password" id="password" autocomplete="current-password" required autofocus></label>
      <button class="btn primary lg" type="submit" id="submit">Sign in</button>
      <div class="error" id="error" role="alert"></div>
    </form>
  </main>
  <script src="/shared/mesh-nodes.js"></script>
  <script>
    if (window.MeshNodes) MeshNodes.attach(document.getElementById('mesh'));

    // Light switch (same as in the app, remembered on this device).
    const lightSwitch = document.getElementById('light-switch');
    function showSwitch() {
      const dark = document.documentElement.getAttribute('data-theme') === 'dark';
      lightSwitch.classList.toggle('dark', dark);
      lightSwitch.setAttribute('aria-checked', dark ? 'false' : 'true');
      lightSwitch.title = dark ? 'Turn the lights on (light mode)' : 'Turn the lights off (dark mode)';
    }
    lightSwitch.addEventListener('click', () => {
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      const set = () => { root.setAttribute('data-theme', next); showSwitch(); };
      try { localStorage.setItem('mesh.theme', next); } catch (e) {}
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return set();
      if (document.startViewTransition) {
        // The new mode spreads out in a circle from the switch, as in the app.
        const box = lightSwitch.getBoundingClientRect();
        const x = box.left + box.width / 2;
        const y = box.top + box.height / 2;
        const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
        root.classList.add('theme-switching');
        const vt = document.startViewTransition(set);
        vt.ready.then(() => {
          root.animate(
            { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)'] },
            { duration: 700, easing: 'cubic-bezier(0.65, 0, 0.35, 1)', pseudoElement: '::view-transition-new(root)' }
          );
        }).catch(() => {});
        vt.finished.finally(() => root.classList.remove('theme-switching'));
        return;
      }
      root.classList.add('theme-transition');
      setTimeout(() => root.classList.remove('theme-transition'), 550);
      set();
    });
    showSwitch();

    const form = document.getElementById('form');
    const error = document.getElementById('error');
    const submit = document.getElementById('submit');
    // Where to go afterwards, e.g. /#/quote/abc
    const next = location.hash.length > 1 ? location.hash : '#/';

    fetch('/api/session').then((r) => r.json()).then((s) => {
      if (s.signedIn) location.replace('/' + next);
      else if (s.setupMessage && s.setup === 'password') error.textContent = s.setupMessage;
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      submit.disabled = true;
      submit.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not sign in');
        location.replace('/' + next);
      } catch (err) {
        error.textContent = err.message;
        submit.disabled = false;
        submit.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
