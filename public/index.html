<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Mesh Quotes</title>
  <script>
    // Apply the saved light/dark choice before anything is drawn.
    (function () {
      var t = null;
      try { t = localStorage.getItem('mesh.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="icon" href="/img/favicon.png">
  <!-- Lets Edge and Chrome install the site as an app with its own window. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="theme-color" content="#0d1420">
  <meta name="apple-mobile-web-app-title" content="Mesh Quotes">
  <!-- Load the fonts straight away, so text doesn't jump when they arrive. -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/poppins-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <!-- Shown while the app starts, so the header doesn't flash in. -->
    <header class="app-header"><span class="brand"><img src="/img/mesh-logo-white.png" alt="Mesh"><span>Quotes</span></span></header>
  </div>
  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/shared/calc.js"></script>
  <script src="/shared/mesh-nodes.js"></script>
  <script src="/app.js"></script>
</body>
</html>
